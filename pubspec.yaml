name: flame_path_shapes
description: "Testbed for the proposed Flame path/shape changes"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  collection: ^1.18.0
  flame: ^1.38.2
  flame_forge2d: ^0.20.0
  flame_noise: ^0.3.3+23
  flame_svg: ^2.0.0
  flame_test: ^2.3.1
  material_ui: ^1.0.0
  meta: ^1.19.0
  url_launcher: ^6.3.0
  vector_graphics_compiler: ^1.3.0
  web: ^1.1.1
  widgetbook: ^3.25.0

dev_dependencies:
  flame_lint: ^1.4.3
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  flame:
    git:
      url: https://github.com/adario/flame
      path: packages/flame
      ref: feat/path-svgs
  flame_forge2d:
    git:
      url: https://github.com/adario/flame
      path: packages/flame_forge2d
      ref: feat/path-svgs
  flame_test:
    git:
      url: https://github.com/adario/flame
      path: packages/flame_test
      ref: feat/path-svgs
  flame_svg:
    git:
      url: https://github.com/adario/flame
      path: packages/flame_svg
      ref: feat/path-svgs

flutter:
  uses-material-design: true

  assets:
    - assets/images/animations/
    - assets/images/
    - assets/images/tile_maps/
    - assets/images/layers/
    - assets/images/parallax/
    - assets/images/parallax/
    - assets/images/rogue_shooter/
    - assets/spine/
    - assets/svgs/
    - assets/tiles/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/yarn/

  fonts:
    - family: LEDBoard-7
      fonts:
        - asset: fonts/led_board-7.ttf
